{% extends "base.html" %}
{% block title %}Tài khoản{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="panel">
  <h1 class="h4">Tài khoản</h1><p class="text-muted">{{ g.user.email }} · {{ ROLE_LABEL[g.user.role] }}</p>
  <form method="post" class="row g-3">
    <div class="col-12"><label class="form-label">Họ tên</label><input class="form-control" name="full_name" value="{{ g.user.full_name }}" required></div>
    <div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control" name="phone" value="{{ g.user.phone or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Quận/huyện</label><select class="form-select" name="district"><option value="">—</option>{% for d in DISTRICTS %}<option {{ 'selected' if d==g.user.district }}>{{ d }}</option>{% endfor %}</select></div>
    <div class="col-12"><label class="form-label">Địa chỉ</label><input class="form-control" name="address" value="{{ g.user.address or '' }}"></div>
    {% if g.user.role == 'shipper' %}<div class="col-12"><label class="form-label">Phương tiện</label><input class="form-control" name="vehicle" value="{{ g.user.vehicle or '' }}"></div>{% endif %}
    <div class="col-12"><label class="form-label">Đổi mật khẩu (bỏ trống nếu giữ nguyên)</label><input class="form-control" type="password" name="new_password"></div>
    <div class="col-12"><button class="btn btn-leaf">Lưu thay đổi</button></div>
  </form></div></div></div>
{% endblock %}
