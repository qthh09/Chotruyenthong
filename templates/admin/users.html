{% extends "base.html" %}
{% block title %}Quản lý người dùng{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Quản lý người dùng</h1>
<div class="panel p-0 table-responsive"><table class="table mb-0"><thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr></thead><tbody>
{% for u in items %}<tr><td>{{ u.full_name }}</td><td>{{ u.email }}</td>
<form method="post"><input type="hidden" name="user_id" value="{{ u.id }}">
<td><select class="form-select form-select-sm" name="role" onchange="this.form.submit()">{% for k, v in roles.items() %}<option value="{{ k }}" {{ 'selected' if u.role==k }}>{{ v }}</option>{% endfor %}</select></td>
<td>{{ '🔒 Đã khoá' if u.is_locked else 'Hoạt động' }}</td><td><button class="btn btn-sm btn-outline-{{ 'success' if u.is_locked else 'danger' }}" name="toggle_lock" value="1">{{ 'Mở khoá' if u.is_locked else 'Khoá' }}</button></td></form></tr>{% endfor %}</tbody></table></div>
{% endblock %}
