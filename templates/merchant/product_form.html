{% extends "base.html" %}
{% block title %}Sản phẩm{% endblock %}
{% block content %}
{% include "merchant/_nav.html" %}
<h1 class="h4 mb-3">{{ 'Sửa sản phẩm' if p else 'Thêm sản phẩm' }}</h1>
<form method="post" class="panel row g-3">
  <div class="col-md-8"><label class="form-label">Tên sản phẩm</label><input class="form-control" name="name" value="{{ p.name if p else '' }}" required></div>
  <div class="col-md-4"><label class="form-label">Biểu tượng (emoji)</label><input class="form-control" name="emoji" value="{{ p.emoji if p else '🥬' }}" maxlength="4"></div>
  <div class="col-md-3"><label class="form-label">Giá bán (đ)</label><input class="form-control" type="number" name="price" min="0" value="{{ p.price if p else '' }}" required></div>
  <div class="col-md-3"><label class="form-label">Đơn vị</label><input class="form-control" name="unit" value="{{ p.unit if p else 'kg' }}"></div>
  <div class="col-md-3"><label class="form-label">Tồn kho</label><input class="form-control" type="number" name="stock" min="0" value="{{ p.stock if p else 0 }}" required></div>
  <div class="col-md-3"><label class="form-label">Khối lượng/đơn vị (kg)</label><input class="form-control" type="number" step="0.1" name="weight_kg" value="{{ p.weight_kg if p else 1 }}"></div>
  <div class="col-md-6"><label class="form-label">Ngành hàng</label><select class="form-select" name="category_id">{% for c in cats %}<option value="{{ c.id }}" {{ 'selected' if (p and p.category_id==c.id) or (not p and s.category_id==c.id) }}>{{ c.name }}</option>{% endfor %}</select></div>
  <div class="col-md-6"><label class="form-label">Lô hàng (nguồn gốc)</label><select class="form-select" name="batch_id"><option value="">— Chưa gắn lô —</option>{% for b in batches %}<option value="{{ b.id }}" {{ 'selected' if p and p.batch_id==b.id }}>{{ b.batch_code }} – {{ b.supplier.name }}</option>{% endfor %}</select></div>
  <div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" name="description" rows="3">{{ p.description if p else '' }}</textarea></div>
  <div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="is_active" id="act" {{ 'checked' if (not p) or p.is_active }}><label class="form-check-label" for="act">Hiển thị trên chợ số</label></div>
  <div class="col-12"><button class="btn btn-leaf">Lưu sản phẩm</button> <a class="btn btn-outline-dark" href="{{ url_for('merchant.products') }}">Quay lại</a></div>
</form>
{% endblock %}
